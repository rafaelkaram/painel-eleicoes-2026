<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Urna com indicador ao vivo">
  <rect width="64" height="64" rx="14" fill="#0A0E16"/>
  <!-- corpo -->
  <rect x="11" y="22" width="42" height="31" rx="5" fill="#262A33"/>
  <rect x="11.75" y="22.75" width="40.5" height="29.5" rx="4.25" fill="none" stroke="#3C4A3C" stroke-width="1.5"/>
  <!-- boca acesa -->
  <rect x="20" y="17" width="24" height="7" rx="3.5" fill="#3FE56C"/>
  <!-- barra dividida na face -->
  <clipPath id="c-barra"><rect x="19" y="33" width="26" height="7" rx="3.5"/></clipPath>
  <g clip-path="url(#c-barra)">
    <rect x="19" y="33" width="13.5" height="7" fill="#3FE56C"/>
    <rect x="32.5" y="33" width="12.5" height="7" fill="#FFB95F"/>
  </g>
  <!-- pulso ao vivo -->
  <circle cx="48" cy="16" r="9" fill="#3FE56C" opacity="0.22"/>
  <circle cx="48" cy="16" r="5" fill="#3FE56C" stroke="#0A0E16" stroke-width="2"/>
</svg>
