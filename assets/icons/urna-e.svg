  <rect x="23" y="17" width="18" height="3" rx="1.5" fill="#0A0E16"/>
  <!-- barra dividida recortada na face -->
  <rect x="18" y="35" width="28" height="9" rx="4.5" fill="#0A0E16"/>
  <clipPath id="e-barra"><rect x="20" y="37" width="24" height="5" rx="2.5"/></clipPath>
  <g clip-path="url(#e-barra)">
    <rect x="20" y="37" width="12.4" height="5" fill="#3FE56C"/>
