<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Urna eletrônica">
  <rect width="64" height="64" rx="14" fill="#0A0E16"/>
  <!-- dorso da cunha -->
  <rect x="11" y="9" width="42" height="8" rx="3.5" fill="#9AA3AE"/>
  <!-- face inclinada -->
  <rect x="5" y="13" width="54" height="37" rx="5" fill="#DFE2EE"/>
  <!-- pé -->
  <rect x="12" y="49" width="40" height="5" rx="2.5" fill="#9AA3AE"/>
  <!-- tela -->
  <rect x="9" y="17" width="28" height="29" rx="2.5" fill="#0A0E16"/>
  <!-- a barra dividida do painel, acesa na tela -->
  <clipPath id="f-barra"><rect x="12" y="37" width="22" height="5" rx="2.5"/></clipPath>
  <g clip-path="url(#f-barra)">
    <rect x="12" y="37" width="11.4" height="5" fill="#3FE56C"/>
    <rect x="23.4" y="37" width="10.6" height="5" fill="#FFB95F"/>
  </g>
  <!-- teclado -->
  <rect x="40" y="17" width="16" height="29" rx="2.5" fill="#31353E"/>
  <g fill="#869583">
    <rect x="42" y="20" width="5" height="3.4" rx="1"/>
    <rect x="49" y="20" width="5" height="3.4" rx="1"/>
    <rect x="42" y="25" width="5" height="3.4" rx="1"/>
    <rect x="49" y="25" width="5" height="3.4" rx="1"/>
    <rect x="42" y="30" width="5" height="3.4" rx="1"/>
    <rect x="49" y="30" width="5" height="3.4" rx="1"/>
  </g>
  <!-- branco, corrige, confirma -->
  <rect x="41.4" y="37" width="4.2" height="6" rx="1.3" fill="#DFE2EE"/>
  <rect x="45.9" y="37" width="4.2" height="6" rx="1.3" fill="#FFB95F"/>
  <rect x="50.4" y="37" width="4.2" height="6" rx="1.3" fill="#3FE56C"/>
</svg>
