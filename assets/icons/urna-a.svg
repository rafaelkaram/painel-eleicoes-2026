<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Urna com cédula de apuração">
  <rect width="64" height="64" rx="14" fill="#0A0E16"/>
  <!-- cédula entrando na urna: é a barra dividida do painel -->
  <g>
    <clipPath id="a-cedula"><rect x="21" y="9" width="22" height="17" rx="3"/></clipPath>
    <g clip-path="url(#a-cedula)">
      <rect x="21" y="9" width="11.4" height="17" fill="#3FE56C"/>
      <rect x="32.4" y="9" width="10.6" height="17" fill="#FFB95F"/>
    </g>
  </g>
  <!-- corpo da urna -->
  <rect x="13" y="25" width="38" height="28" rx="5" fill="#262A33"/>
  <rect x="13.75" y="25.75" width="36.5" height="26.5" rx="4.25" fill="none" stroke="#3C4A3C" stroke-width="1.5"/>
  <!-- boca -->
  <rect x="20" y="23" width="24" height="6" rx="3" fill="#0A0E16"/>
  <!-- medidor de apuração -->
  <rect x="20" y="42" width="24" height="4" rx="2" fill="#0F131C"/>
  <rect x="20" y="42" width="15" height="4" rx="2" fill="#3FE56C"/>
</svg>
