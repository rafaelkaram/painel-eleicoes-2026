name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar no Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; empurrões novos cancelam a fila, não o que já roda.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # O Pages serve a partir de /<repo>/, então o base-href precisa
      # acompanhar — sem isso o app carrega em branco.
      - name: Build
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # O app usa URL sem `#`, e o Pages é servidor estático: ele procura um
      # arquivo chamado `apuracao` no disco e devolve 404 antes de o Flutter
      # subir. Servindo o mesmo index como página de erro, o app carrega e o
      # go_router lê a URL real. É o preço de manter a rota limpa — a
      # resposta sai com status 404, mas a tela certa aparece.
      - name: Fallback de rota para o Pages
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    name: Publicar no Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
